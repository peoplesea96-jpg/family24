<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 가족 캘린더 목업</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--accent:#4f46e5;--soft:#eef2ff;--shadow:0 10px 30px rgba(17,24,39,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin-bottom:24px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px 12px;border-radius:10px;margin:4px 0}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.family{margin-top:24px;padding:14px;border-radius:14px;background:#1f2937}.avatars{display:flex;gap:7px;margin-top:10px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}.main{padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.title{font-size:28px;font-weight:800}.controls,.topRight{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.seg{display:flex;padding:4px;background:#fff;border:1px solid var(--line);border-radius:12px}.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px}.seg button.active{background:var(--accent);color:#fff}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px}.toolbar input{flex:1;min-width:220px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.cal{padding:14px}.weekhead,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekhead div{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:6px}.day{min-height:120px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}.day:hover{border-color:#c7d2fe}.day.selected{outline:2px solid var(--accent);background:#fafaff}.day.out{opacity:.45}.daynum{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px}.holiday{color:#dc2626;font-size:10px}.event{font-size:11px;padding:6px 7px;border-radius:8px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:4px solid}.more{font-size:11px;color:var(--accent);font-weight:700}.detail{padding:16px;min-height:680px}.muted{color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{font-size:11px;background:#f3f4f6;padding:6px 8px;border-radius:999px}.card{border:1px solid var(--line);border-radius:12px;padding:11px;margin:9px 0}.card .name{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:4px}.section{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;padding:7px 9px;border-radius:9px}.tab.active{background:var(--soft);color:#3730a3;border-color:#c7d2fe}.pane{display:none;margin-top:12px}.pane.active{display:block}.kv{display:grid;grid-template-columns:100px 1fr;gap:8px;font-size:13px;margin:7px 0}.badge{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;display:inline-block}.proposal{background:#fef3c7;color:#92400e}.confirmed{background:#dcfce7;color:#166534}.adjust{background:#e0e7ff;color:#3730a3}.cancel{background:#fee2e2;color:#991b1b}.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status3 div{border:1px solid var(--line);background:#f9fafb;border-radius:10px;padding:10px;text-align:center;font-size:12px}.comment{border-bottom:1px solid var(--line);padding:9px 0}.comment p{margin:4px 0 0;font-size:12px}.weekwrap{overflow:auto}.weekgrid{min-width:900px;display:grid;grid-template-columns:78px repeat(7,1fr)}.wcell{min-height:48px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;font-size:10px}.whead{background:#f9fafb;text-align:center;font-weight:800;padding:10px}.time{background:#f9fafb;color:var(--muted)}.slot{height:100%;border-radius:6px}.available{background:#dcfce7}.busy{background:#fee2e2}.maybe{background:#fef3c7}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.modalcard{background:#fff;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid var(--line);padding:9px;border-radius:9px}.notice{margin-top:10px;background:#eff6ff;border:1px solid #bfdbfe;padding:9px;border-radius:10px;font-size:12px}.notif{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}@media(max-width:1080px){.layout{grid-template-columns:1fr}.detail{min-height:auto}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:12px}.brand{margin-bottom:8px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.family{display:none}.main{padding:12px}.top{align-items:flex-start;flex-direction:column}.title{font-size:22px}.weekhead,.grid{gap:4px}.day{min-height:92px;padding:5px}.event{font-size:9px;padding:4px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">👨‍👩‍👧‍👦 우리 가족 캘린더</div><div class="nav"><button class="active">📅 캘린더</button><button id="openNotif">🔔 알림 (3)</button><button>🔎 일정 검색</button><button>⚙️ 가족 설정</button></div><div class="family"><b>우리 가족</b><div class="muted" style="font-size:11px;color:#9ca3af">관리자 2명 · 구성원 4명</div><div class="avatars"><div class="avatar" style="background:#2563eb">아</div><div class="avatar" style="background:#db2777">엄</div><div class="avatar" style="background:#16a34a">민</div><div class="avatar" style="background:#7c3aed">서</div></div></div></aside>
<main class="main"><div class="top"><div class="controls"><div class="title">2026년 9월</div><div class="seg"><button class="active" data-view="month">월간</button><button data-view="week">주간</button></div></div><div class="topRight"><button class="btn" id="exportBtn">CSV / XLSX 내보내기</button><button class="btn primary" id="newEvent">+ 일정 만들기</button></div></div>
<div class="toolbar"><input id="search" placeholder="일정 제목 또는 내용 검색"><select id="typeFilter"><option value="">모든 유형</option><option>가족식사</option><option>병원</option><option>학교</option><option>개인</option></select><select id="statusFilter"><option value="">모든 상태</option><option>제안</option><option>조율 중</option><option>확정</option><option>취소</option></select></div>
<div class="layout"><section class="panel cal"><div id="monthView"><div class="weekhead"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div><div id="calendar" class="grid"></div></div><div id="weekView" style="display:none"><div class="weekwrap"><div id="weekgrid" class="weekgrid"></div></div><div class="notice">주간 캘린더는 1시간 단위로 보여주는 PRD 기준 목업입니다.</div></div></section><aside class="panel detail" id="detail"><h3 style="margin:0">9월 27일 일요일</h3><div class="muted" style="font-size:12px">선택한 날짜의 일정과 조율 현황</div><div class="chips" id="chips"></div><div id="eventList"></div><div class="section" id="detailContent"></div></aside></div></main></div>
<div class="modal" id="eventModal"><div class="modalcard"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">새 일정 만들기</h2><button class="btn" id="closeEvent">✕</button></div><div class="form" style="margin-top:14px"><label class="field full">제목<input id="fTitle" value="주말 가족 외식"></label><label class="field">상태<select id="fStatus"><option>제안</option><option>확정</option></select></label><label class="field">유형<select id="fType"><option>가족식사</option><option>병원</option><option>학교</option><option>개인</option></select></label><label class="field">날짜<input type="date" id="fDate" value="2026-09-27"></label><label class="field">우선순위<select id="fPriority"><option>일반</option><option>필수</option></select></label><label class="field">시작 시간<input type="time" id="fStart" value="18:00"></label><label class="field">종료 시간<input type="time" id="fEnd" value="20:00"></label><label class="field">공개 범위<select><option>가족 전체</option><option>특정 구성원</option><option>나만 보기</option></select></label><label class="field">참여 대상<select><option>가족 전체</option><option>일부 구성원</option></select></label><label class="field full">장소명<input value="천안역 인근 식당"></label><label class="field full">주소<input value="충남 천안시 동남구"></label><label class="field full">장소 메모<input value="주차는 건물 뒤편"></label><label class="field full">설명<textarea rows="3">이번 주말 가족 식사 일정입니다. 가능한 시간을 표시해주세요.</textarea></label></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" id="cancelEvent">취소</button><button class="btn primary" id="saveEvent">저장</button></div></div></div>
<div class="modal" id="notifModal"><div class="modalcard" style="max-width:540px"><div style="display:flex;justify-content:space-between"><h2 style="margin:0">내부 알림</h2><button class="btn" id="closeNotif">✕</button></div><div class="notif"><b>가족 외식</b> 시간이 18:00 → 19:00으로 변경되어 다시 조율 중입니다.</div><div class="notif"><b>서연 치과</b> 일정이 확정되었습니다.</div><div class="notif"><b>엄마</b>님이 가족 외식 일정에 댓글을 남겼습니다.</div><div class="muted" style="font-size:11px;margin-top:10px">알림 90일 보관 정책 목업</div></div></div>
<script>
const colors={가족식사:'#f59e0b',병원:'#3b82f6',학교:'#10b981',개인:'#8b5cf6'};
let events=[
{id:1,date:'2026-09-27',title:'가족 외식',type:'가족식사',status:'조율 중',time:'19:00~21:00',priority:'필수',desc:'주말 가족 저녁식사',place:'천안역 인근',participants:['아빠','엄마','민수','서연']},
{id:2,date:'2026-09-27',title:'서연 치과',type:'병원',status:'확정',time:'14:00~15:00',priority:'일반',desc:'정기 검진',place:'OO치과',participants:['엄마','서연']},
{id:3,date:'2026-09-27',title:'민수 과제',type:'학교',status:'확정',time:'',priority:'일반',desc:'제출 마감',place:'',participants:['민수']},
{id:4,date:'2026-09-28',title:'아빠 건강검진',type:'병원',status:'확정',time:'09:00~11:00',priority:'필수',desc:'공복',place:'검진센터',participants:['아빠']},
{id:5,date:'2026-09-30',title:'가족 장보기',type:'가족식사',status:'제안',time:'18:00~19:00',priority:'일반',desc:'주말 식재료',place:'마트',participants:['아빠','엄마']},
{id:6,date:'2026-10-03',title:'개천절 가족산책',type:'개인',status:'제안',time:'10:00~12:00',priority:'일반',desc:'공휴일 산책',place:'공원',participants:['아빠','엄마','민수','서연']}
];
let selectedDate='2026-09-27',selectedEvent=1;
function iso(d){return d.toISOString().slice(0,10)}
function days(){let s=new Date(2026,7,31);return Array.from({length:42},(_,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);return d})}
function filtered(){const q=search.value.trim().toLowerCase(),tf=typeFilter.value,sf=statusFilter.value;return events.filter(e=>(!q||(e.title+' '+e.desc).toLowerCase().includes(q))&&(!tf||e.type===tf)&&(!sf||e.status===sf))}
function badge(s){const c=s==='확정'?'confirmed':s==='제안'?'proposal':s==='조율 중'?'adjust':'cancel';return `<span class="badge ${c}">${s}</span>`}
function renderCal(){calendar.innerHTML='';const f=filtered();days().forEach(d=>{const key=iso(d),box=document.createElement('div');box.className='day'+(d.getMonth()!==8?' out':'')+(key===selectedDate?' selected':'');box.onclick=()=>{selectedDate=key;selectedEvent=(events.find(e=>e.date===key)||{}).id||null;renderAll()};const hol=key==='2026-10-03'?'개천절':'';box.innerHTML=`<div class="daynum"><span>${d.getDate()}</span><span class="holiday">${hol}</span></div>`;const ev=f.filter(e=>e.date===key);ev.slice(0,3).forEach(e=>{const x=document.createElement('div');x.className='event';x.style.background=colors[e.type]+'18';x.style.borderLeftColor=colors[e.type];x.textContent=(e.time?e.time.split('~')[0]+' ':'')+e.title;x.onclick=v=>{v.stopPropagation();selectedDate=e.date;selectedEvent=e.id;renderAll()};box.appendChild(x)});if(ev.length>3){const m=document.createElement('div');m.className='more';m.textContent=`+${ev.length-3}개 더보기`;box.appendChild(m)}calendar.appendChild(box)})}
function renderSide(){const f=filtered().filter(e=>e.date===selectedDate),d=new Date(selectedDate+'T00:00:00'),names=['일','월','화','수','목','금','토'];detail.querySelector('h3').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${names[d.getDay()]}요일`;chips.innerHTML=`<span class="chip">${f.length}개 일정</span><span class="chip">4명 중 3명 가능</span><span class="chip">월요일 시작</span>`;eventList.innerHTML='';if(!f.length){eventList.innerHTML='<div class="muted" style="padding:18px;text-align:center">일정이 없습니다.</div>';detailContent.innerHTML='';return}f.forEach(e=>{const c=document.createElement('div');c.className='card';c.style.borderLeft=`5px solid ${colors[e.type]}`;c.innerHTML=`<div class="name">${e.title}</div><div class="meta">${e.time||'시간 미정'} · ${e.type} · ${badge(e.status)}</div>`;c.onclick=()=>{selectedEvent=e.id;renderDetail()};eventList.appendChild(c)});if(!selectedEvent||!f.some(e=>e.id===selectedEvent))selectedEvent=f[0].id;renderDetail()}
function renderDetail(){const e=events.find(x=>x.id===selectedEvent);if(!e){detailContent.innerHTML='';return}detailContent.innerHTML=`<div class="tabs"><button class="tab active" data-tab="info">일정 정보</button><button class="tab" data-tab="coord">시간 조율</button><button class="tab" data-tab="comments">댓글</button><button class="tab" data-tab="history">변경 이력</button></div><div class="pane active" id="p-info"><div class="kv"><b>상태</b><span>${badge(e.status)}</span></div><div class="kv"><b>유형</b><span>${e.type}</span></div><div class="kv"><b>시간</b><span>${e.time||'시간 미정'}</span></div><div class="kv"><b>우선순위</b><span>${e.priority}</span></div><div class="kv"><b>장소</b><span>${e.place||'-'}</span></div><div class="kv"><b>참여 대상</b><span>${e.participants.join(', ')}</span></div><div class="kv"><b>설명</b><span>${e.desc}</span></div></div><div class="pane" id="p-coord"><div class="status3"><div><b>가능</b><br>3명</div><div><b>불가능</b><br>1명</div><div><b>미정</b><br>0명</div></div><div class="section"><b>후보 시간대</b><div class="card">18:00~20:00 · 가능 3 / 불가 1</div><div class="card">19:00~21:00 · 가능 3 / 불가 1</div><div class="card">20:00~22:00 · 가능 2 / 미정 1 / 불가 1</div></div></div><div class="pane" id="p-comments"><div class="comment"><b>엄마</b><p>19시 이후면 좋아요. 주차 쉬운 곳이면 좋겠어요.</p></div><div class="comment"><b>민수</b><p>20시까지는 과제 마무리하고 갈 수 있어요.</p></div><div style="display:flex;gap:6px;margin-top:8px"><input class="btn" style="flex:1" placeholder="댓글 입력"><button class="btn primary">등록</button></div></div><div class="pane" id="p-history"><div class="comment"><b>오늘 10:20 · 아빠</b><p>시간 18:00 → 19:00 변경</p></div><div class="comment"><b>오늘 10:20 · 시스템</b><p>확정 → 조율 중 상태 변경</p></div></div>`;detailContent.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{detailContent.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));detailContent.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('p-'+b.dataset.tab).classList.add('active')})}
function renderWeek(){weekgrid.innerHTML='<div class="whead">시간</div>'+['9/21 월','9/22 화','9/23 수','9/24 목','9/25 금','9/26 토','9/27 일'].map(x=>`<div class="whead">${x}</div>`).join('');for(let h=8;h<=22;h++){weekgrid.innerHTML+=`<div class="wcell time">${String(h).padStart(2,'0')}:00</div>`;for(let d=0;d<7;d++){let c='',t='';if(d===6&&[18,19,20].includes(h)){c='available';t=h===19?'가족 외식 후보':''}if(d===6&&h===14){c='busy';t='서연 치과'}if(d===0&&[9,10].includes(h)){c='busy';t=h===9?'아빠 일정':''}weekgrid.innerHTML+=`<div class="wcell"><div class="slot ${c}">${t}</div></div>`}}}
function renderAll(){renderCal();renderSide();renderWeek()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');monthView.style.display=b.dataset.view==='month'?'block':'none';weekView.style.display=b.dataset.view==='week'?'block':'none'});[search,typeFilter,statusFilter].forEach(x=>x.addEventListener('input',renderAll));newEvent.onclick=()=>eventModal.classList.add('open');closeEvent.onclick=cancelEvent.onclick=()=>eventModal.classList.remove('open');saveEvent.onclick=()=>{const id=Math.max(...events.map(e=>e.id))+1,start=fStart.value,end=fEnd.value;events.push({id,date:fDate.value,title:fTitle.value||'새 일정',type:fType.value,status:fStatus.value,time:start&&end?`${start}~${end}`:'',priority:fPriority.value,desc:'새로 추가한 목업 일정',place:'',participants:['아빠','엄마','민수','서연']});selectedDate=fDate.value;selectedEvent=id;eventModal.classList.remove('open');renderAll()};openNotif.onclick=()=>notifModal.classList.add('open');closeNotif.onclick=()=>notifModal.classList.remove('open');exportBtn.onclick=()=>alert('목업: 실제 구현에서는 CSV와 XLSX 파일을 생성합니다.');renderAll();
</script>
</body></html>
